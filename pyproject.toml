[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "A modular, configurable RAG server exposed through MCP."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "langchain-text-splitters>=0.3.0,<2.0.0",
    "chromadb>=0.4.0",
    "mcp>=1.0.0",
    "jieba>=0.42",
    "markitdown[pdf]>=0.1.0",
    "Pillow>=10.0,<13.0",
    "streamlit>=1.30.0",
    # Ragas 0.3 still imports a module removed by langchain-community 0.4.
    # Keep both packages in the version range that can be imported together.
    "ragas>=0.3.9,<0.4.0",
    "langchain-community>=0.3.31,<0.4.0",
    "datasets>=2.0.0",
    "sentence-transformers>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "unit: fast tests for isolated modules",
    "integration: tests covering collaboration between modules",
    "e2e: end-to-end workflow tests",
]
