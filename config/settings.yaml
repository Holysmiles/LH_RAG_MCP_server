project:
  name: modular-rag-mcp-server
  environment: development

llm:
  provider: openai
  model: gpt-4o-mini
  api_key: ${OPENAI_API_KEY}

# 图片描述使用独立 Provider；C7 只会在 enabled=true 时创建它。
# 输入：文字指令 + 图片路径/base64/bytes；输出：可写入 Chunk 的 caption 文本。
vision_llm:
  enabled: false
  provider: azure
  model: gpt-4o
  api_key: ${AZURE_API_KEY}
  azure_endpoint: ${AZURE_OPENAI_ENDPOINT}
  deployment_name: gpt-4o
  api_version: 2024-10-21
  max_image_size: 2048

embedding:
  provider: openai
  model: text-embedding-3-small
  api_key: ${OPENAI_API_KEY}

splitter:
  provider: recursive
  chunk_size: 1000
  chunk_overlap: 200

vector_store:
  provider: chroma
  persist_directory: ./data/db/chroma
  collection_name: knowledge_hub

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: false
  provider: none

evaluation:
  enabled: false
  provider: custom

observability:
  log_level: INFO
  trace_enabled: true
  trace_file: ./logs/traces.jsonl

dashboard:
  enabled: true
  port: 8501

ingestion:
  batch_size: 100
  chunk_refiner:
    # 规则清洗始终执行。启用后再调用共享 llm 配置，失败自动回退到规则结果。
    use_llm: false
  metadata_enricher:
    # 规则模式始终可用；开启后使用共享 llm provider 生成结构化元数据，失败自动回退。
    use_llm: false
